plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.beacon.ai'
version = '1.0.0'

android {
  namespace "expo.modules.beaconai"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags "-std=c++17"
        arguments "-DANDROID_STL=c++_shared"
        // Needle ships an arm64 engine only; other ABIs build a stub so the app still runs (keyword routing)
        abiFilters "arm64-v8a", "x86_64"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}

dependencies {
  // Offline speech recognition (Apache-2.0). Ships libvosk.so for arm64-v8a, armeabi-v7a, x86 and x86_64; its POM pulls in JNA.
  implementation 'com.alphacephei:vosk-android:0.3.75'
}
