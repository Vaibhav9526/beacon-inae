name: Release Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (creates tag v1.0.1 on the selected commit)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: '1'
      NDK_VERSION: '30.0.14904198'
      CMAKE_VERSION: '4.1.2'
      GRADLE_OPTS: '-Xmx3g -Dorg.gradle.daemon=false'
    steps:
      - name: Check signing secrets
        env:
          KS_B64: ${{ secrets.BEACON_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BEACON_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.BEACON_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BEACON_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS_B64" ] && missing="$missing BEACON_KEYSTORE_B64"
          [ -z "$KS_PASS" ] && missing="$missing BEACON_KEYSTORE_PASSWORD"
          [ -z "$KS_ALIAS" ] && missing="$missing BEACON_KEY_ALIAS"
          [ -z "$KEY_PASS" ] && missing="$missing BEACON_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions (see docs/releasing.md). Refusing to publish an unsigned or debug-signed APK."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Derive version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            RAW="$INPUT_VERSION"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$RAW' is not a valid version tag (expected vMAJOR.MINOR.PATCH, e.g. v1.0.1)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -q '-'; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: beacon/package-lock.json

      - name: Install JS dependencies (runs patch-package via postinstall)
        working-directory: beacon
        run: npm ci

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set version
        working-directory: beacon
        run: node scripts/set-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Generate native Android project (android/ is not committed)
        working-directory: beacon
        run: npx expo prebuild --platform android --no-install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('beacon/package-lock.json', 'beacon/app.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.BEACON_KEYSTORE_B64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/beacon-release.jks"
          test -s "$RUNNER_TEMP/beacon-release.jks" || { echo "::error::BEACON_KEYSTORE_B64 did not decode to a keystore"; exit 1; }
          echo "BEACON_KEYSTORE_PATH=$RUNNER_TEMP/beacon-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK (arm64-v8a)
        working-directory: beacon/android
        env:
          BEACON_KEYSTORE_PASSWORD: ${{ secrets.BEACON_KEYSTORE_PASSWORD }}
          BEACON_KEY_ALIAS: ${{ secrets.BEACON_KEY_ALIAS }}
          BEACON_KEY_PASSWORD: ${{ secrets.BEACON_KEY_PASSWORD }}
          NODE_ENV: production
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a --max-workers=2 --no-daemon

      - name: Verify signature and stage assets
        id: apk
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="$(find beacon/android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$SRC" || { echo "::error::No release APK produced"; exit 1; }
          mkdir -p dist
          cp "$SRC" "dist/beacon-${VERSION}.apk"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BT/apksigner" verify --print-certs "dist/beacon-${VERSION}.apk" | tee "$RUNNER_TEMP/cert.txt"
          if grep -qi "Android Debug" "$RUNNER_TEMP/cert.txt"; then echo "::error::APK is signed with the debug key"; exit 1; fi
          (cd dist && sha256sum "beacon-${VERSION}.apk" > "beacon-${VERSION}.apk.sha256")
          echo "sha=$(cut -d' ' -f1 "dist/beacon-${VERSION}.apk.sha256")" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Beacon ${{ steps.ver.outputs.version }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/beacon-${{ steps.ver.outputs.version }}.apk
            dist/beacon-${{ steps.ver.outputs.version }}.apk.sha256
          body: |
            Beacon ${{ steps.ver.outputs.version }} for Android (arm64-v8a).

            min-android: 8
            sha256: ${{ steps.apk.outputs.sha }}

            Install: download `beacon-${{ steps.ver.outputs.version }}.apk`, open it on the phone and allow installs from this source. If the development build is installed, uninstall it once first (different signature).

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/beacon-release.jks"
