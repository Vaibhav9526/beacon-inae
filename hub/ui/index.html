<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Beacon Hub</title>
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img class="mark" src="logo.png" width="28" height="28" alt="">
        <div>
          <strong>Beacon Hub</strong>
          <span class="small muted">Family desk</span>
        </div>
      </div>
      <nav id="nav" aria-label="Pages"></nav>
    </aside>
    <main class="main">
      <div class="wrap" id="view"></div>
    </main>
  </div>

  <div id="sheet" class="sheet" hidden></div>
  <div id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-scrim" data-close="1"></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" tabindex="-1"></aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="avatar.js"></script>
  <script src="app.js"></script>
</body>
</html>
