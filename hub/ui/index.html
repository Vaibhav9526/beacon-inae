<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Beacon Hub</title>
  <link rel="icon" href="logo.png">
  <script>
    /* Set the saved theme before first paint. Dark is the default. */
    try {
      var t = localStorage.getItem('beacon:theme');
      if (t === 'light' || t === 'system' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage blocked: keep the default */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/nodes.css">
  <link rel="stylesheet" href="css/gateway.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/family.css">
  <link rel="stylesheet" href="css/mcp.css">
</head>
<body>
  <div id="app" class="app"></div>
  <noscript>Beacon Hub needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
